crons:
  - name: balance-links
    description: "Checks group-tour balance links hourly and sends the next payment link by SMS and email"
    cron: "0 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/balance-links"
    method: POST
    enabled: true
